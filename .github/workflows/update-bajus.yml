name: Update BAJUS rate

on:
  schedule:
    - cron: "7 * * * *"   # every hour, at minute 7
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-bajus
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check BAJUS rate
        run: python3 scripts/update_bajus.py

      - name: Save if changed
        run: |
          if git diff --quiet; then
            echo "Nothing to save"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bajus.json
          git commit -m "BAJUS rate update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
